openapi: 3.0.3
info:
  title: RepoWiki AI API
  description: >
    Shared API contract between frontend and backend.
    Any change to an endpoint's request/response shape must be
    reflected here FIRST, then reviewed by both frontend and backend
    owners before implementation.
  version: 0.1.0

servers:
  - url: http://localhost:8000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Repository
  - name: Analysis
  - name: Chat
  - name: Export

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /repository/analyze:
    post:
      tags: [Repository]
      summary: Submit a GitHub repo URL for analysis
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_url]
              properties:
                repo_url: { type: string, example: "https://github.com/facebook/react" }
      responses:
        "202":
          description: Analysis job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  analysis_id: { type: string }
                  status: { type: string, example: "queued" }

  /repository/status/{analysis_id}:
    get:
      tags: [Repository]
      summary: Poll analysis progress (used by loading screen)
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [queued, cloning, scanning, generating, done, failed]
                  progress_percent: { type: integer, example: 65 }

  /analysis/{analysis_id}/summary:
    get:
      tags: [Analysis]
      summary: Dashboard overview (tech stack, stats)
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Summary data
          content:
            application/json:
              schema:
                type: object
                properties:
                  tech_stack: { type: array, items: { type: string } }
                  file_count: { type: integer }
                  loc_count: { type: integer }
                  languages: { type: array, items: { type: string } }

  /analysis/{analysis_id}/files:
    get:
      tags: [Analysis]
      summary: File tree for File Explorer module
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  tree:
                    type: array
                    items:
                      $ref: "#/components/schemas/FileNode"

  /analysis/{analysis_id}/wiki:
    get:
      tags: [Analysis]
      summary: Generated wiki sections (Markdown)
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Wiki content
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        content_markdown: { type: string }

  /analysis/{analysis_id}/diagrams:
    get:
      tags: [Analysis]
      summary: Architecture/flow diagrams
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Diagram data
          content:
            application/json:
              schema:
                type: object
                properties:
                  mermaid: { type: string }
                  react_flow_json: { type: object }

  /chat/{repo_id}:
    post:
      tags: [Chat]
      summary: Ask a question about the analyzed repo
      parameters:
        - name: repo_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
      responses:
        "200":
          description: AI answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  answer: { type: string }
                  sources:
                    type: array
                    items: { type: string }

  /export/{analysis_id}:
    get:
      tags: [Export]
      summary: Export wiki as PDF, Markdown, or DOCX
      parameters:
        - name: analysis_id
          in: path
          required: true
          schema: { type: string }
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, markdown, docx]
      responses:
        "200":
          description: File stream
          content:
            application/octet-stream: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"

    FileNode:
      type: object
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, folder] }
        children:
          type: array
          items:
            $ref: "#/components/schemas/FileNode"
