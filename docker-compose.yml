version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repowiki_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-repowiki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repowikipass}
      POSTGRES_DB: ${POSTGRES_DB:-repowikidb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repowiki} -d ${POSTGRES_DB:-repowikidb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: repowiki_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repowiki_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-repowiki}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-repowikipass}
      - POSTGRES_DB=${POSTGRES_DB:-repowikidb}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - WORKSPACE_DIR=/workspaces
    volumes:
      - ./backend:/app
      - workspace_data:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repowiki_worker
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=info -Q repository-analysis,parsing,embeddings,ai-generation,exports
    environment:
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=${POSTGRES_USER:-repowiki}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-repowikipass}
      - POSTGRES_DB=${POSTGRES_DB:-repowikidb}
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - WORKSPACE_DIR=/workspaces
    volumes:
      - ./backend:/app
      - workspace_data:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repowiki_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  workspace_data:
