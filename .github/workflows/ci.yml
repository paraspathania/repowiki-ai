name: CI

on:
  push:
    branches: [ main, develop, dev ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    name: Backend — Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit detect-secrets ruff

      - name: Run Ruff linter
        run: |
          cd backend
          ruff check app/ || true

      - name: Run Bandit security scan
        run: |
          bandit -r backend/app/ -ll -ii || true

      - name: Detect secrets in codebase
        run: |
          detect-secrets scan --baseline .secrets.baseline || true

  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://repowiki:repowiki@localhost:5432/repowiki_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-not-production
      OPENAI_API_KEY: sk-test-placeholder
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: repowiki
          POSTGRES_PASSWORD: repowiki
          POSTGRES_DB: repowiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest (unit tests, security tests)
        run: |
          cd backend
          pytest tests/ -v --tb=short

  frontend-test:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run ESLint
        run: |
          cd frontend
          npx eslint src/ --ext .ts,.tsx --max-warnings=50 || true

      - name: Run TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit || true

      - name: Run build check
        run: |
          cd frontend
          npm run build --if-present
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
